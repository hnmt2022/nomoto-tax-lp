<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お問い合わせ｜公認会計士・税理士 野本裕美</title>
<meta name="description" content="訪問相談についてのご質問、どちらのサービスが合うかのご相談などお気軽にお問い合わせください。公認会計士・税理士 野本裕美。">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="brand">お問い合わせ<small>公認会計士・税理士 野本裕美</small></div>
    <a class="header-cta" href="index.html">サービス案内に戻る</a>
  </div>
</header>

<!-- ============ 1. 案内 ============ -->
<section class="hero">
  <div class="container">
    <h1 style="font-size:clamp(24px, 4vw, 32px); color:var(--color-navy);">お問い合わせ</h1>
    <p class="hero-sub">
      訪問相談についてのご質問や、「どちらのサービスが合うか分からない」というご相談も承っています。<br>
      下記フォームにご記入のうえ、送信してください。内容を確認し、担当よりご連絡いたします。
    </p>
  </div>
</section>

<!-- ============ 2. フォーム ============ -->
<section>
  <div class="container">
    <div id="form-status" class="form-status" hidden></div>

    <form id="contact-form" class="contact-form">

      <!-- ハニーポット（人には見えない・ボット対策用） -->
      <div class="form-hp" aria-hidden="true">
        <label for="website">website</label>
        <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
      </div>

      <div class="form-group">
        <label for="name">お名前<span class="form-required">必須</span></label>
        <input type="text" id="name" name="name" required autocomplete="name">
      </div>

      <div class="form-group">
        <label for="email">メールアドレス<span class="form-required">必須</span></label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="tel">お電話番号<span class="form-optional">任意</span></label>
        <input type="tel" id="tel" name="tel" autocomplete="tel">
      </div>

      <div class="form-group">
        <label for="area">お住まいの地域<span class="form-optional">任意</span></label>
        <input type="text" id="area" name="area" placeholder="例：札幌市〇〇区">
      </div>

      <div class="form-group">
        <label for="topic">お問い合わせ内容<span class="form-required">必須</span></label>
        <select id="topic" name="topic" required>
          <option value="">選択してください</option>
          <option value="年金と税金の書類整理相談について">年金と税金の書類整理相談について</option>
          <option value="わが家の財産・はじめの整理相談について">わが家の財産・はじめの整理相談について</option>
          <option value="どちらが合うか分からない">どちらが合うか分からない</option>
          <option value="その他">その他</option>
        </select>
      </div>

      <div class="form-group">
        <label for="message">ご相談内容の詳細<span class="form-required">必須</span></label>
        <textarea id="message" name="message" required placeholder="気になっていることや、ご質問の内容をご記入ください。"></textarea>
      </div>

      <div class="cta-wrap" style="margin:8px 0 0;">
        <button type="submit" id="form-submit" class="btn btn-primary btn-block">送信する</button>
        <p class="btn-note">送信いただいた内容は、お問い合わせへの対応のみに使用します。</p>
      </div>
    </form>

    <div id="back-link-wrap" class="cta-wrap" style="margin-top:16px;" hidden>
      <a class="btn btn-secondary btn-block" href="index.html">サービス案内に戻る</a>
    </div>
  </div>
</section>

<!-- ============ フッター ============ -->
<footer class="site-footer">
  <div class="container">
    <div class="footer-links">
      <a href="index.html">サービス案内</a>
      <a href="tax-check.html">年金と税金の書類整理相談</a>
      <a href="asset-check.html">わが家の財産・はじめの整理相談</a>
      <a href="javascript:void(0);" title="準備中">特定商取引法に基づく表記</a>
    </div>
    <p class="footer-address">
      公認会計士・税理士 野本裕美<br>
      札幌市内・隣接エリア対応（訪問／オンライン）
    </p>
  </div>
</footer>

<script>
(function () {
  // Apps Script を「ウェブアプリ」としてデプロイした後、発行されたURLに書き換えてください。
  var GAS_ENDPOINT = "https://script.google.com/macros/s/AKfycbyMybGzlv5DmuaW3gFeAYZIUsu3RC4p7LDVKKaoodSgbyIDyEeM0erX9uZiTXHwR25P/exec";

  var form = document.getElementById('contact-form');
  var statusBox = document.getElementById('form-status');
  var submitBtn = document.getElementById('form-submit');
  var backLinkWrap = document.getElementById('back-link-wrap');

  // URLの ?topic=tax / asset に応じて、お問い合わせ内容を自動選択
  var topicMap = {
    tax: '年金と税金の書類整理相談について',
    asset: 'わが家の財産・はじめの整理相談について'
  };
  var topicParam = new URLSearchParams(location.search).get('topic');
  if (topicParam && topicMap[topicParam]) {
    form.topic.value = topicMap[topicParam];
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault();

    if (form.website.value) {
      // ハニーポット欄が埋まっていればボットとみなして何もしない
      return;
    }

    if (GAS_ENDPOINT.indexOf('https://') !== 0) {
      showStatus('error', '送信先が未設定です。恐れ入りますがお電話にてお問い合わせください。');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = '送信中…';

    fetch(GAS_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      body: new FormData(form)
    }).then(function () {
      form.hidden = true;
      showStatus('success', '✓ お問い合わせを受け付けました\n内容を確認のうえ、担当よりご連絡いたします。');
      backLinkWrap.hidden = false;
    }).catch(function () {
      submitBtn.disabled = false;
      submitBtn.textContent = '送信する';
      showStatus('error', '送信に失敗しました。時間をおいて再度お試しいただくか、お電話でお問い合わせください。');
    });
  });

  function showStatus(type, message) {
    statusBox.className = 'form-status ' + type;
    statusBox.textContent = message;
    statusBox.hidden = false;
    statusBox.setAttribute('tabindex', '-1');
    statusBox.focus();
    statusBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
})();
</script>

</body>
</html>
